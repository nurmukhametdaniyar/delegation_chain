name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Differential oracle, extended profile (SPEC §9.7)
        run: DC_ORACLE_CASES=150000 DC_ORACLE_LOGIC_CASES=150000 cargo test --release -p dc-policy --test oracle
      - name: Unsafe policy (SPEC §0 rule 9)
        run: scripts/check-unsafe.sh
      - name: Dependency policy (D-29, SPEC §0 rule 3)
        run: scripts/check-deps.sh
