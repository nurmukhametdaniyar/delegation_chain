[package]
name = "dc-crypto"
description = "Signature-scheme traits; Ed25519 per hop (the protocol) and the BLS aggregate variant, pairing cache (SPEC §5)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The default instantiation is Ed25519 per hop (paper §4.2) and needs no
# feature.
default = []
# VARIANT (SPEC §0 rule 3): BLS12-381, the aggregate variant (paper §4.8) and
# the BLS benchmark arms (A, A-ind, B, A-mt). blst is built only with it.
variant-bls = ["dep:blst"]
# One verification runs on one thread in every arm (D-29). Implies the BLS
# variant; arm A-mt is the BLS variant without it.
blst-no-threads = ["variant-bls", "blst/no-threads"]
# VARIANT (SPEC §0 rule 3): the prefix-cache trait (arms B and D), and, with
# `variant-bls`, arm B's pairing cache (SPEC §5.7, §12.1).
variant-prefix = []
# Per-verification operation counts (SPEC §10.3). Never in headline runs.
count-ops = []
# Per-phase time of each verification (SPEC §10.3; D-77). Never in headline
# runs.
phase-timing = []

[dependencies]
blst = { workspace = true, optional = true }
ed25519-dalek.workspace = true
thiserror.workspace = true

[[test]]
name = "bls"
required-features = ["variant-bls"]
