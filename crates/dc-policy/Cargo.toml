[package]
name = "dc-policy"
description = "Policy AST, text parser and printer, validation, Evaluate and Contains (SPEC §9)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dc-cbor.workspace = true
dc-types.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true

[features]
# Unvalidated scopes, and the pre-review containment procedure, for the P-15
# regression tests (SPEC §9.7). Never enabled outside tests.
test-hooks = []

[dev-dependencies]
dc-policy = { path = ".", features = ["test-hooks"] }
proptest.workspace = true
serde_json.workspace = true
