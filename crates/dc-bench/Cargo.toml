[package]
name = "dc-bench"
description = "Benchmark harness, workload generators, criterion benches and report generator (SPEC §13)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# `cargo run --release -p dc-bench -- all` (SPEC §13.8).
default-run = "dc-bench"

[lints]
workspace = true

[features]
# One verification runs on one thread in every arm (D-29). The supplementary
# arm A-mt is this crate built with `--no-default-features`, which leaves
# blst's thread pool on; the harness then runs only A-mt rows.
default = ["blst-no-threads"]
blst-no-threads = ["dc-crypto/blst-no-threads"]

[dependencies]
dc-baselines.workspace = true
dc-cbor.workspace = true
dc-chain.workspace = true
dc-crypto = { workspace = true, features = ["variant-ed25519", "variant-prefix"] }
dc-policy.workspace = true
dc-registry.workspace = true
dc-types.workspace = true
dc-verifier = { workspace = true, features = ["variant-prefix-cache"] }
csv = "1"
hdrhistogram = "7"
libc = "0.2"
rand_chacha.workspace = true
rand_core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# Q10 only, as the global allocator of the `dc-bench-memory` binary (D-41).
stats_alloc = "0.1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[lib]
bench = false

[[bin]]
name = "dc-bench"
path = "src/main.rs"
bench = false

[[bin]]
name = "dc-bench-memory"
path = "src/bin/memory.rs"
bench = false

[[bench]]
name = "primitives"
harness = false

[[bench]]
name = "policy"
harness = false

[[bench]]
name = "signing"
harness = false
