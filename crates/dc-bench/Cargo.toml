[package]
name = "dc-bench"
description = "Benchmark harness, workload generators, criterion benches and report generator (SPEC §13)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# `cargo run --release -p dc-bench -- all` (SPEC §13.8).
default-run = "dc-bench"

[lints]
workspace = true

[features]
# One verification runs on one thread in every arm (D-29). The supplementary
# arm A-mt is this crate built with `--no-default-features`, which leaves
# blst's thread pool on; the harness then runs only A-mt rows.
default = ["blst-no-threads"]
blst-no-threads = ["dc-crypto/blst-no-threads"]
# The exploratory phase breakdown (`dc-bench phases`; D-77). A build with it
# refuses to make headline runs (SPEC §10.3).
phase-timing = ["dc-crypto/phase-timing", "dc-verifier/phase-timing"]

[dependencies]
dc-baselines.workspace = true
dc-cbor.workspace = true
dc-chain.workspace = true
# Every arm: the default instantiation and the BLS variant (D-80).
dc-crypto = { workspace = true, features = ["variant-bls", "variant-prefix"] }
dc-policy.workspace = true
dc-registry.workspace = true
dc-types.workspace = true
dc-verifier = { workspace = true, features = ["variant-prefix-cache"] }
csv = "1"
hdrhistogram = "7"
libc = "0.2"
rand_chacha.workspace = true
rand_core.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# Q10 only, as the global allocator of the `dc-bench-memory` binary (D-41).
stats_alloc = "0.1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[lib]
bench = false

[[bin]]
name = "dc-bench"
path = "src/main.rs"
bench = false

[[bin]]
name = "dc-bench-memory"
path = "src/bin/memory.rs"
bench = false

[[bench]]
name = "primitives"
harness = false

[[bench]]
name = "policy"
harness = false

[[bench]]
name = "signing"
harness = false

# Exploratory, not in the frozen plan: Contains at D-21's bounds (D-95).
# `bench = false` keeps it out of `cargo bench -p dc-bench`, which `dc-bench
# all` runs for the frozen criterion pass; run it with `--bench bounds`.
[[bench]]
name = "bounds"
harness = false
bench = false

# Exploratory: Contains after D-97's memoization (D-98), and under the work
# budget (D-99, D-100). Out of `cargo bench -p dc-bench` like bounds.
[[bench]]
name = "contains_cost"
harness = false
bench = false

[[bench]]
name = "contains_budget"
harness = false
bench = false

# Exploratory: what the work budget leaves a compromised signer at its
# default, and line 2 on a 64 KiB scope body (D-100). Out of `cargo bench -p
# dc-bench` like bounds.
[[bench]]
name = "budget_cost"
harness = false
bench = false
