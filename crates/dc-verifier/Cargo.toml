[package]
name = "dc-verifier"
description = "Algorithms 1–2, caches, nonce cache and clock (SPEC §10)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dashmap.workspace = true
dc-cbor.workspace = true
dc-crypto.workspace = true
dc-policy.workspace = true
dc-registry.workspace = true
dc-types.workspace = true
thiserror.workspace = true

[features]
# Per-verification operation counts (SPEC §10.3). Never in headline runs.
count-ops = ["dc-crypto/count-ops"]
# Hooks for the security suite: ignore recorded canonical-form violations
# (D-31) and inject duplicate digests (line 48). Never outside tests.
test-hooks = []

[dev-dependencies]
dc-chain = { workspace = true, features = ["test-hooks"] }
dc-verifier = { path = ".", features = ["count-ops", "test-hooks"] }
