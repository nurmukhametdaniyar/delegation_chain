[package]
name = "dc-registry"
description = "In-memory registry, proof-of-possession, certificates, revocation, policy store (SPEC §6)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dc-cbor.workspace = true
dc-crypto.workspace = true
dc-types.workspace = true
rand_chacha.workspace = true
rand_core.workspace = true
thiserror.workspace = true

[features]
# Models a compromised registry root for the T5b/T5d tests (SPEC §11.2).
# Never enabled outside tests.
test-hooks = []

[dev-dependencies]
dc-crypto = { workspace = true, features = ["variant-ed25519"] }
dc-registry = { path = ".", features = ["test-hooks"] }
