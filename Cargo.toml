# DelegationChain reference implementation and benchmark. See SPEC.md.
#
# The workspace root is also a package (`delegationchain`) so that the
# workspace-level security suite can live in tests/ (SPEC §3.1, D-46).

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
# SPEC §0 rule 9: `unsafe` only where DECISIONS.md allows it (D-48).
unsafe_code = "deny"

[workspace.dependencies]
dc-cbor = { path = "crates/dc-cbor" }
# dc-crypto's default is the protocol's instantiation, Ed25519 per hop. Its
# BLS variant is switched on by the packages that need it, with
# `blst-no-threads` except in the A-mt build (D-29, D-80).
dc-crypto = { path = "crates/dc-crypto", default-features = false }
dc-types = { path = "crates/dc-types" }
# Measurement-affecting crates are pinned exactly (D-47).
blst = "=0.3.17"
ed25519-dalek = { version = "=2.2.0", features = ["batch", "rand_core"] }
sha2 = "=0.10.9"
serde_json = "1"
rand_core = "0.9"
rand_chacha = "0.9"
dc-registry = { path = "crates/dc-registry" }
dc-policy = { path = "crates/dc-policy" }
dc-chain = { path = "crates/dc-chain" }
dc-verifier = { path = "crates/dc-verifier" }
dc-baselines = { path = "crates/dc-baselines" }
dashmap = "6"
thiserror = "2"
unicode-normalization = "0.1.25"
proptest = "1.11"

[package]
name = "delegationchain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Runs the workspace-level suites over the aggregate variant (paper §4.8:
# `Bls` with `BlsAggregate`) instead of the default instantiation (Ed25519
# per hop). `tests/common` picks the scheme (D-84).
aggregate-variant = []

[dependencies]
dc-crypto.workspace = true

[dev-dependencies]
dc-baselines.workspace = true
dc-cbor.workspace = true
dc-chain = { workspace = true, features = ["test-hooks"] }
# The arm tests build every arm, so the BLS variant is always present.
dc-crypto = { workspace = true, features = ["blst-no-threads", "count-ops", "variant-prefix"] }
dc-policy = { workspace = true, features = ["test-hooks"] }
dc-registry = { workspace = true, features = ["test-hooks"] }
dc-types.workspace = true
dc-verifier = { workspace = true, features = ["count-ops", "test-hooks"] }
rand_chacha.workspace = true
rand_core.workspace = true
serde_json.workspace = true

# Dependencies (blst, dalek, …) are compiled optimized in dev and test builds,
# so that the security suite's concurrency test runs in reasonable time.
# Release and bench builds are unaffected.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.bench]
inherits = "release"
