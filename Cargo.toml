# DelegationChain reference implementation and benchmark. See SPEC.md.
#
# The workspace root is also a package (`delegationchain`) so that the
# workspace-level security suite can live in tests/ (SPEC §3.1, D-46).

[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
publish = false

[workspace.lints.rust]
# SPEC §0 rule 9: `unsafe` only where DECISIONS.md allows it (D-48).
unsafe_code = "deny"

[workspace.dependencies]
dc-cbor = { path = "crates/dc-cbor" }
# Internal crates take dc-crypto without its default `blst-no-threads`; leaf
# packages switch it on, so that A-mt can be built without it (D-29).
dc-crypto = { path = "crates/dc-crypto", default-features = false }
dc-types = { path = "crates/dc-types" }
# Measurement-affecting crates are pinned exactly (D-47).
blst = "=0.3.17"
ed25519-dalek = { version = "=2.2.0", features = ["batch", "rand_core"] }
sha2 = "=0.10.9"
serde_json = "1"
rand_core = "0.9"
rand_chacha = "0.9"
dc-registry = { path = "crates/dc-registry" }
dc-policy = { path = "crates/dc-policy" }
dc-chain = { path = "crates/dc-chain" }
dc-verifier = { path = "crates/dc-verifier" }
dashmap = "6"
thiserror = "2"
unicode-normalization = "0.1.25"
proptest = "1.11"

[package]
name = "delegationchain"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
dc-crypto = { workspace = true, features = ["blst-no-threads"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.bench]
inherits = "release"
